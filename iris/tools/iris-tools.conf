# Host-side defaults. Every value can be overridden by an environment variable
# or irisctl's global command-line options.
IRIS_ROOT=${IRIS_ROOT:-$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd)}
IRIS_RUN_DIR="$IRIS_ROOT/run"
IRIS_STATE_FILE="$IRIS_RUN_DIR/ble-bridge.state"
IRIS_PROGRAMS_DIR="$IRIS_ROOT/programs"
IRIS_COMMON_PROGRAMS_DIR="$IRIS_ROOT/../esp/common/programs"
IRIS_UART_DEVICE=/dev/ttyUSB0
IRIS_BLE_SERVICE_UUID=6e6f6f62-6961-4e45-5855-530000000001
IRIS_BLE_DOWNLINK_UUID=6e6f6f62-6961-4e45-5855-530000000002
IRIS_BLE_UPLINK_UUID=6e6f6f62-6961-4e45-5855-530000000003
IRIS_DIAG_SAMPLES=3
IRIS_DIAG_PAUSE_SECONDS=2.1
IRIS_LIGHT_ADC_SAMPLES=16
IRIS_ULTRASONIC_SAMPLES=3
IRIS_ULTRASONIC_TIMEOUT_US=30000
IRIS_IR_BURSTS=20
