<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wisp</title>
  <style>
    :root{color-scheme:dark;--ink:#dffcf0;--dim:#86aa9b;--edge:#28483e;--panel:#0b1714;--glow:#8fffd6}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#07100e;color:var(--ink);font:14px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 70% 15%,#17483b88,transparent 38%),linear-gradient(#ffffff06 1px,transparent 1px);background-size:auto,100% 4px}
    button,input,textarea{font:inherit;color:inherit}button,input{border:1px solid var(--edge);background:#0d211b;padding:.65rem .8rem;border-radius:.45rem}button{cursor:pointer}button:hover{border-color:var(--glow)}
    #login{height:100%;display:grid;place-items:center}.card{width:min(90vw,360px);padding:1.5rem;border:1px solid var(--edge);background:#091713dd;border-radius:1rem;box-shadow:0 20px 80px #000}.mark{font:3rem serif;text-align:center;color:var(--glow);filter:drop-shadow(0 0 12px #6fffc888)}h1{font-size:1.2rem;text-align:center;letter-spacing:.18em}#password{width:100%;margin:.8rem 0}.error{color:#ff9999;min-height:1.4em}
    #app{height:100%;display:none;flex-direction:column}.top,.bar{display:flex;align-items:center;gap:.6rem;padding:.65rem .8rem;background:#091713dd;border-bottom:1px solid var(--edge)}.top strong{letter-spacing:.15em}.status{margin-left:auto;color:var(--dim)}
    #terminal,#editor{flex:1;min-height:0;width:100%;padding:1rem;background:#050c0a99;border:0;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}#editor{display:none;resize:none;outline:none;color:var(--ink)}
    .bar{border-top:1px solid var(--edge);border-bottom:0;flex-wrap:wrap}#command{flex:1;min-width:14rem}#path{width:min(35vw,24rem)}.muted{color:var(--dim)}
    @media(max-width:640px){.bar>*{flex:1}.bar #command,.bar #path{flex-basis:100%;width:100%}}
  </style>
</head>
<body>
  <section id="login"><form class="card" id="loginForm"><div class="mark">⌁</div><h1>WISP CONSOLE</h1><div class="muted">A small doorway into the machine.</div><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button type="submit">Enter</button><div class="error" id="error"></div></form></section>
  <main id="app"><header class="top"><strong>⌁ WISP</strong><span id="cwd" class="muted"></span><span id="status" class="status">connecting</span></header><pre id="terminal" aria-live="polite"></pre><textarea id="editor" spellcheck="false"></textarea><footer class="bar"><input id="command" autocomplete="off" placeholder="Linux command"><button id="run">Run</button><button id="interrupt">Ctrl+C</button><button id="clear">Clear</button><input id="path" placeholder="relative file path"><button id="edit">Editor</button></footer></main>
<script>
const $=id=>document.getElementById(id), login=$('login'), app=$('app'), terminal=$('terminal'), editor=$('editor'), command=$('command'), path=$('path'), status=$('status'), cwd=$('cwd');
let editing=false, source;
async function api(url,options={}){options.headers={...(options.headers||{}),'Content-Type':'application/json'};const r=await fetch(url,options);let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);return j}
function append(text){terminal.textContent+=text.replace(/\x1b\[[0-?]*[ -\/]*[@-~]/g,'').replace(/\r/g,'');let lines=terminal.textContent.split('\n');if(lines.length>1000)terminal.textContent=lines.slice(-1000).join('\n');terminal.scrollTop=terminal.scrollHeight}
function connect(){if(source)source.close();source=new EventSource('/events');source.onopen=()=>status.textContent='online';source.onerror=()=>status.textContent='reconnecting';source.addEventListener('output',e=>{try{const bin=atob(e.data),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));append(new TextDecoder().decode(bytes))}catch{}})}
async function refreshCwd(){try{cwd.textContent=(await api('/api/cwd')).cwd}catch{cwd.textContent=''}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('error').textContent='';try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('password').value})});login.style.display='none';app.style.display='flex';path.value='notes.txt';connect();refreshCwd();command.focus()}catch(err){$('error').textContent=err.message}};
async function run(){const cmd=command.value;if(!cmd.trim())return;command.value='';await api('/api/run',{method:'POST',body:JSON.stringify({cmd})});setTimeout(refreshCwd,150)}
command.onkeydown=e=>{if(e.key==='Enter')run().catch(err=>append(`\n[${err.message}]\n`))};$('run').onclick=()=>run().catch(err=>append(`\n[${err.message}]\n`));$('interrupt').onclick=()=>api('/api/signal',{method:'POST',body:JSON.stringify({signal:'INT'})}).catch(err=>append(`\n[${err.message}]\n`));$('clear').onclick=()=>terminal.textContent='';
$('edit').onclick=async()=>{try{if(!editing){if(!path.value.trim())throw Error('enter a relative file path');const j=await api('/api/file?path='+encodeURIComponent(path.value.trim()));editor.value=j.content||'';terminal.style.display='none';editor.style.display='block';command.disabled=path.disabled=true;$('edit').textContent='Save & Close';editing=true;editor.focus()}else{const j=await api('/api/file',{method:'PUT',body:JSON.stringify({path:path.value.trim(),content:editor.value})});editor.style.display='none';terminal.style.display='block';command.disabled=path.disabled=false;$('edit').textContent='Editor';editing=false;append(`\n[saved ${j.bytes} bytes to ${j.path}]\n`);command.focus()}}catch(err){alert(err.message)}};
</script>
</body>
</html>
