<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wisp</title><style>
:root{color-scheme:dark;--ink:#dcfff1;--dim:#88ae9e;--edge:#285044;--panel:#091713;--glow:#8fffd6;--bad:#ffaaa3}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#06100d;color:var(--ink);font:14px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 70% 10%,#17504088,transparent 40%)}button,input,textarea{font:inherit;color:inherit;border:1px solid var(--edge);background:#0d211b;padding:.65rem .8rem;border-radius:.45rem}button{cursor:pointer}button:hover{border-color:var(--glow)}button.danger{border-color:#713d3d;color:#ffc4bf}#login{height:100%;display:grid;place-items:center}.card{width:min(92vw,390px);padding:1.5rem;border:1px solid var(--edge);background:#091713ee;border-radius:1rem}.mark{font:3rem serif;text-align:center;color:var(--glow)}h1{font-size:1.1rem;letter-spacing:.15em}#password{width:100%;margin:.8rem 0}.error{color:var(--bad);min-height:1.4em}#app{height:100%;display:none;flex-direction:column}.top,.bar{display:flex;align-items:center;gap:.6rem;padding:.65rem .8rem;background:#091713ee;border-bottom:1px solid var(--edge)}.top strong{letter-spacing:.14em}.status{margin-left:auto;color:var(--dim)}nav button.active{border-color:var(--glow);color:var(--glow)}.pane{display:none;flex:1;min-height:0}.pane.active{display:flex}.console{flex-direction:column}#terminal,#editor{flex:1;min-height:0;width:100%;padding:1rem;background:#050c0a99;border:0;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}#editor{display:none;resize:none;outline:none}.bar{border-top:1px solid var(--edge);border-bottom:0;flex-wrap:wrap}#command{flex:1;min-width:14rem}#path{width:min(35vw,24rem)}.codex{padding:1rem;gap:1rem;overflow:auto}.chat{flex:2;display:flex;flex-direction:column;min-width:0}.side{flex:1;max-width:42rem;min-width:18rem}.setup{margin:auto;width:min(100%,42rem)}[hidden]{display:none!important}.output{flex:1;min-height:15rem;white-space:pre-wrap;overflow:auto;border:1px solid var(--edge);background:#050c0a;padding:1rem;border-radius:.6rem}.prompt{width:100%;min-height:7rem;margin-top:.7rem;resize:vertical}.actions{display:flex;gap:.5rem;margin-top:.5rem}.grid{display:grid;grid-template-columns:1fr;gap:.35rem}.grid label{margin-top:.55rem;color:var(--glow)}.help{display:block;color:var(--dim);font-size:.82rem;margin-top:-.25rem;margin-bottom:.15rem}.grid input{width:100%}.muted{color:var(--dim)}.notice{padding:.7rem;border:1px solid var(--edge);border-radius:.5rem;margin:.7rem 0;white-space:pre-wrap}.key{word-break:break-all;font-size:.82rem}@media(max-width:760px){.codex{flex-direction:column}.side{max-width:none}.bar>*{flex:1}.bar input{flex-basis:100%!important;width:100%!important}}
</style></head><body>
<section id="login"><form class="card" id="loginForm"><div class="mark">⌁</div><h1>WISP CONSOLE</h1><div class="muted">A small doorway into the machine.</div><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button>Enter</button><div class="error" id="error"></div></form></section>
<main id="app"><header class="top"><strong>⌁ WISP</strong><nav><button data-pane="console" class="active">Console</button><button data-pane="codex">Codex</button></nav><span id="cwd" class="muted"></span><span id="status" class="status">connecting</span></header>
<section id="console" class="pane console active"><pre id="terminal"></pre><textarea id="editor" spellcheck="false"></textarea><footer class="bar"><input id="command" autocomplete="off" placeholder="Linux command"><button id="run">Run</button><button id="interrupt">Ctrl+C</button><button id="clear">Clear</button><input id="path" placeholder="relative file path"><button id="edit">Editor</button></footer></section>
<section id="codex" class="pane codex"><div id="connectorSetup" class="side setup"><h1>CONNECT CLOVER</h1><p>1. Press the button on Clover.</p><p>2. Open the downloaded file.</p><p>3. Keep its small window open while using Codex.</p><a id="downloadConnector" href="/api/connector/download"><button>Download Wisp Connector</button></a><div id="connectorNotice" class="notice muted">Waiting for Clover…</div></div><div id="codexChat" class="chat" hidden><header class="top"><strong>CODEX</strong><span class="muted">Clover connected</span><button id="clearConnector" class="danger" style="margin-left:auto">Disconnect Clover</button></header><div id="codexOutput" class="output muted">What shall we make?</div><textarea id="prompt" class="prompt" placeholder="What would you like Codex to do?"></textarea><div class="actions"><button id="sendCodex">Send task</button><button id="stopCodex">Stop</button></div></div></section></main>
<script>
const $=id=>document.getElementById(id);let source,editing=false,poll;async function api(url,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json'};const r=await fetch(url,o);let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||j.output||`HTTP ${r.status}`);return j}function append(t){const e=$('terminal');e.textContent+=t.replace(/\x1b\[[0-?]*[ -\/]*[@-~]/g,'').replace(/\r/g,'');e.scrollTop=e.scrollHeight}function connect(){source?.close();source=new EventSource('/events');source.onopen=()=>status.textContent='online';source.onerror=()=>status.textContent='reconnecting';source.addEventListener('output',e=>{try{append(new TextDecoder().decode(Uint8Array.from(atob(e.data),c=>c.charCodeAt(0))))}catch{}})}async function cwd(){try{$('cwd').textContent=(await api('/api/cwd')).cwd}catch{}}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('login').style.display='none';$('app').style.display='flex';connect();cwd()}catch(x){$('error').textContent=x.message}};async function run(){let c=$('command').value;if(!c.trim())return;$('command').value='';await api('/api/run',{method:'POST',body:JSON.stringify({cmd:c})});setTimeout(cwd,150)}$('command').onkeydown=e=>{if(e.key==='Enter')run().catch(x=>append(`\n[${x.message}]\n`))};$('run').onclick=()=>run();$('interrupt').onclick=()=>api('/api/signal',{method:'POST',body:'{"signal":"INT"}'});$('clear').onclick=()=>terminal.textContent='';$('edit').onclick=async()=>{try{if(!editing){let j=await api('/api/file?path='+encodeURIComponent($('path').value));$('editor').value=j.content||'';$('terminal').style.display='none';$('editor').style.display='block';$('edit').textContent='Save & Close';editing=true}else{let j=await api('/api/file',{method:'PUT',body:JSON.stringify({path:$('path').value,content:$('editor').value})});$('editor').style.display='none';$('terminal').style.display='block';$('edit').textContent='Editor';editing=false;append(`\n[saved ${j.bytes} bytes]\n`)}}catch(x){alert(x.message)}};
for(const b of document.querySelectorAll("nav button"))b.onclick=()=>{document.querySelectorAll("nav button,.pane").forEach(x=>x.classList.remove("active"));b.classList.add("active");$(b.dataset.pane).classList.add("active");if(b.dataset.pane==="codex")watchConnector()};async function connectorState(){try{let j=await api("/api/connector/status");$("connectorSetup").hidden=j.connected;$("codexChat").hidden=!j.connected;$("connectorNotice").textContent=j.connected?"Clover connected.":"Waiting for Clover… Download and open the connector on Clover.";if(j.running)pollResult()}catch(x){$("connectorNotice").textContent=x.message}}function watchConnector(){connectorState();clearInterval(window.connectorPoll);window.connectorPoll=setInterval(connectorState,2000)}$("downloadConnector").onclick=()=>{$("connectorNotice").textContent="Downloaded. Open Start-Wisp-Connector.cmd on Clover."};$("clearConnector").onclick=async()=>{if(!confirm("Disconnect Clover?"))return;await api("/api/connector",{method:"DELETE"});$("codexChat").hidden=true;$("connectorSetup").hidden=false;$("connectorNotice").textContent="Disconnected. Download a new connector to reconnect."};$("sendCodex").onclick=async()=>{try{await api("/api/codex/run",{method:"POST",body:JSON.stringify({prompt:$("prompt").value})});$("codexOutput").textContent="Codex is working…";pollResult()}catch(x){$("codexOutput").textContent=x.message}};function pollResult(){clearInterval(poll);poll=setInterval(async()=>{try{let j=await api("/api/codex/result");$("codexOutput").textContent=j.output||"Codex is working…";$("codexOutput").scrollTop=$("codexOutput").scrollHeight;if(!j.running)clearInterval(poll)}catch{clearInterval(poll)}},700)}$("stopCodex").onclick=()=>api("/api/codex/stop",{method:"POST"});
</script></body></html>
